<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
  </head>
  <body>
    <h1>Calculator</h1>
    <div class="container">
      <div class="calc">
        <div class="calc-display">
        </div>
        <div class="calc-buttons noselect" id="backspace"><button>⌫</button></div>
        <div class="calc-buttons noselect" id="clear"><button>C</button></div>
        <div class="calc-buttons noselect" id="percent"><button>%</button></div>
        <div class="calc-buttons noselect" id="divide"><button>÷</button></div>
        <div class="calc-buttons noselect num" id="seven"><button value="7">7</button></div>
        <div class="calc-buttons noselect num" id="eight"><button value="8">8</button></div>
        <div class="calc-buttons noselect num" id="nine"><button value="9">9</button></div>
        <div class="calc-buttons noselect" id="times"><button>×</button></div>
        <div class="calc-buttons noselect num" id="four"><button value="4">4</button></div>
        <div class="calc-buttons noselect num" id="five"><button value="5">5</button></div>
        <div class="calc-buttons noselect num" id="six"><button value="6">6</button></div>
        <div class="calc-buttons noselect" id="minus"><button>−</button></div>
        <div class="calc-buttons noselect num" id="one"><button value="1">1</button></div>
        <div class="calc-buttons noselect num" id="two"><button value="2">2</button></div>
        <div class="calc-buttons noselect num" id="three"><button value="3">3</button></div>
        <div class="calc-buttons noselect" id="plus"><button>+</button></div>
        <div class="calc-buttons noselect" id="plusminus"><button>±</button></div>
        <div class="calc-buttons noselect num" id="zero"><button value="0">0</button></div>
        <div class="calc-buttons noselect num" id="dot"><button value=".">.</button></div>
        <div class="calc-buttons noselect" id="equals"><button>=</button></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
